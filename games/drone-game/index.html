<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无人机躲避挑战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(42,223,255,0.14), transparent 28%),
                radial-gradient(circle at 82% 18%, rgba(56,248,165,0.1), transparent 26%),
                linear-gradient(135deg, #071018 0%, #111a33 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #eff9ff;
            padding: 24px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(126,231,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(126,231,255,0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.74), transparent 82%);
        }
        #backBtn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, #2adfff, #38f8a5);
            color: #031018;
            padding: 11px 18px;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.24);
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 12px 34px rgba(42,223,255,0.22);
        }
        #backBtn:hover { transform: translateY(-2px); }
        #gameContainer {
            position: relative;
            width: min(800px, calc(100vw - 32px));
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(126,231,255,0.22);
            background: rgba(7,16,24,0.76);
            box-shadow: 0 26px 90px rgba(0,0,0,0.42), 0 0 52px rgba(42,223,255,0.16);
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; color: #fff; font-size: 16px;
            gap: 10px;
        }
        #ui .stat {
            background: rgba(7,16,24,0.78);
            border: 1px solid rgba(126,231,255,0.18);
            padding: 8px 16px;
            backdrop-filter: blur(10px);
        }
        #ui .score { color: #38f8a5; }
        #ui .level { color: #2adfff; }
        #ui .lives { color: #ff6b7a; }
        #startScreen, #gameOverScreen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 50% 28%, rgba(42,223,255,0.13), transparent 34%),
                rgba(7,16,24,0.92);
            display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(6px);
            padding: 26px;
            text-align: center;
        }
        #gameOverScreen { display: none; }
        h1 { color: #2adfff; font-size: clamp(30px, 5vw, 46px); margin-bottom: 15px; text-shadow: 0 0 24px rgba(42,223,255,0.45); }
        .subtitle { color: #aebfc8; font-size: 16px; margin-bottom: 30px; line-height: 1.6; }
        .btn {
            background: linear-gradient(135deg, #2adfff 0%, #38f8a5 100%);
            color: #031018; border: none; padding: 13px 42px;
            font-size: 18px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; font-weight: bold;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(42,223,255,0.42); }
        .instructions { color: #8aa1ad; margin-top: 25px; text-align: center; line-height: 1.8; }
        .instructions span {
            display: inline-block;
            background: rgba(42,223,255,0.1);
            border: 1px solid rgba(42,223,255,0.2);
            padding: 3px 10px;
            font-family: "Courier New", monospace;
        }
        #finalScore { font-size: 64px; color: #38f8a5; text-shadow: 0 0 30px rgba(56,248,165,0.42); }
        #droneIcon { font-size: 70px; margin-bottom: 15px; }
        @media (max-width: 680px) {
            body { justify-content: flex-start; padding-top: 86px; overflow: auto; }
            #ui {
                top: 12px;
                left: 12px;
                right: 12px;
                font-size: 13px;
            }
            #ui .stat { padding: 7px 9px; }
            .instructions span { padding: 2px 7px; }
        }
    </style>
</head>
<body>
    <a href="../../index.html" id="backBtn">← 返回首页</a>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div class="stat score">分数: <span id="scoreDisplay">0</span></div>
            <div class="stat level">等级: <span id="levelDisplay">1</span></div>
            <div class="stat lives">生命: <span id="livesDisplay">❤️❤️❤️</span></div>
        </div>
        
        <div id="startScreen">
            <div id="droneIcon">🚁</div>
            <h1>无人机躲避挑战</h1>
            <p class="subtitle">操控无人机躲避障碍物，看看能飞多远！</p>
            <button class="btn" id="startBtn">开始飞行</button>
            <div class="instructions">
                <p><span>↑</span><span>↓</span><span>←</span><span>→</span> 或 <span>W</span><span>A</span><span>S</span><span>D</span> 控制移动</p>
            </div>
        </div>
        
        <div id="gameOverScreen">
            <h1>飞行结束</h1>
            <p class="subtitle">最终得分</p>
            <div id="finalScore">0</div>
            <button class="btn" id="restartBtn" style="margin-top:20px">再来一次</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
